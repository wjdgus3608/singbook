name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Generate api_keys.dart from secrets
        run: |
          cat > lib/config/api_keys.dart << 'EOF'
          class ApiKeys {
            static const acrHost = '${{ secrets.ACR_HOST }}';
            static const acrAccessKey = '${{ secrets.ACR_ACCESS_KEY }}';
            static const acrAccessSecret = '${{ secrets.ACR_ACCESS_SECRET }}';
          }
          EOF

      - name: Verify api_keys.dart
        run: |
          if grep -qE "= '';" lib/config/api_keys.dart; then
            echo "ERROR: One or more API keys are empty. Check GitHub Secrets."
            cat lib/config/api_keys.dart
            exit 1
          fi
          echo "api_keys.dart generated successfully"

      - name: Install dependencies
        run: flutter pub get

      - name: Patch record_android (fix flutter.compileSdkVersion in AGP 8+)
        run: |
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 34/' \
            $HOME/.pub-cache/hosted/pub.dev/record_android-1.5.2/android/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singbook-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
